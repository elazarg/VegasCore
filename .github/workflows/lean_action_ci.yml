name: Lean Action CI

on:
  # Branches only: a tag such as `research-tree` names a tree checked when it was
  # on a branch.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to a branch or pull request supersedes its running check. On
# main a running check finishes, and only the newest waiting push runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Check documentation references resolve
        run: python scripts/check-doc-references.py
      - name: Require centralized Lean options
        run: python scripts/check-lean-options.py
      - name: Test repository checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check module boundaries and build reachability
        run: python scripts/check-module-boundaries.py
      - name: Record the GameTheory revision
        id: gametheory
        run: echo "sha=$(git -C GameTheory rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # lean-action caches the root `.lake` only; the GameTheory path dependency
      # builds into its own directory.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: GameTheory/.lake
          key: gametheory-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.gametheory.outputs.sha }}
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      - name: Build with centralized warning-as-error options
        run: lake build

  docs:
    # API documentation takes far longer than the build, so only main publishes it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Record the GameTheory revision
        id: gametheory
        run: echo "sha=$(git -C GameTheory rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: GameTheory/.lake
          key: gametheory-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.gametheory.outputs.sha }}
      # docgen-action expects the toolchain and the build of the same job; the
      # build job's caches make this build a restore.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      # docgen-action builds any existing `homepage` folder as a Jekyll site.
      # `docs/` holds design notes, not a site, so the API docs get their own.
      - uses: leanprover-community/docgen-action@56dff2bb89f3e9b8c1b6d5c8410362c19de2d904 # v1
        with:
          homepage: site
